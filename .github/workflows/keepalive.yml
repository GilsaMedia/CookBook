name: Keep Supabase awake

# Free Supabase projects pause after about a week with little database
# activity. Calling public.keepalive() every three days keeps the hosted
# project awake. Set the repository variables SUPABASE_URL and
# SUPABASE_PUBLISHABLE_KEY (both public values). Until they're set, this
# job skips.
#
# GitHub turns off scheduled workflows in a repo with no commits for 60
# days; re-enable it from the Actions tab if that happens.
on:
  schedule:
    - cron: "23 5 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call public.keepalive()
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY isn't set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
